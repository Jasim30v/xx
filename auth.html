<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💗 لحظة | تسجيل الدخول</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        
    :root{
        --glass:rgba(236,72,153,0.03);
        --border:rgba(236,72,153,0.12);
        --accent:#ec4899;
        --accent2:#f472b6;
        --bg:#020617;
        --card:rgba(236,72,153,0.06);
        --danger:#ef4444;
        --success:#22c55e;
        --warning:#f59e0b;
        --gold:#fbbf24;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background:var(--bg);
        color:#fff;
        -webkit-tap-highlight-color:transparent;
        user-select:none;
        -webkit-user-select:none;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
    @keyframes scaleIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes pinkGlow{0%,100%{box-shadow:0 0 20px rgba(236,72,153,0.3)}50%{box-shadow:0 0 40px rgba(244,114,182,0.7)}}
    @keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.3)}50%{box-shadow:0 0 40px rgba(251,191,36,0.7)}}
    .spinner{
        width:36px;height:36px;
        border:3px solid rgba(236,72,153,0.2);
        border-top-color:var(--accent);
        border-radius:50%;
        animation:spin 0.7s linear infinite;
        margin:30px auto;
    }
    .toast-msg{
        position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
        background:rgba(2,6,23,0.95);padding:12px 24px;border-radius:30px;
        z-index:10000;border:1px solid rgba(236,72,153,0.3);font-size:13px;
        opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;
        box-shadow:0 8px 32px rgba(0,0,0,0.4);
    }
    .toast-msg.show{opacity:1}
    .overlay{
        position:fixed;inset:0;background:rgba(2,6,23,0.97);
        backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
        z-index:400;overflow-y:auto;
        animation:fadeIn 0.3s ease;
    }
    .overlay-header{
        display:flex;justify-content:space-between;align-items:center;
        padding:16px 20px;border-bottom:1px solid var(--border);
        position:sticky;top:0;background:rgba(2,6,23,0.9);
        backdrop-filter:blur(20px);z-index:5;
    }
    .overlay-header h3{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
    .btn-close-overlay{
        background:rgba(236,72,153,0.1);border:1px solid var(--border);
        color:#fff;width:36px;height:36px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;font-size:16px;transition:all 0.3s;
    }
    .btn-close-overlay:hover{background:rgba(236,72,153,0.25);box-shadow:0 0 15px rgba(236,72,153,0.3)}

        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #1a0a2e, #0d060c, #020617);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            position: relative;
            font-family: 'Segoe UI', 'Tajawal', -apple-system, sans-serif;
            padding: 20px;
        }
        
        /* ═══ الخلفية المتحركة ═══ */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: orbFloat 20s infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb:nth-child(1) { width: 400px; height: 400px; background: #ec4899; top: -100px; right: -100px; }
        .bg-orb:nth-child(2) { width: 350px; height: 350px; background: #f472b6; bottom: -100px; left: -100px; animation-delay: 5s; }
        .bg-orb:nth-child(3) { width: 300px; height: 300px; background: #a855f7; top: 50%; left: 50%; animation-delay: 10s; }
        
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.3); }
        }
        
        /* ═══ الجسيمات ═══ */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #f472b6;
            border-radius: 50%;
            animation: particleFloat 10s infinite linear;
            opacity: 0.3;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* ═══ البطاقة الرئيسية ═══ */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 40px 28px;
            border: 1px solid rgba(236, 72, 153, 0.25);
            box-shadow: 0 30px 70px rgba(236, 72, 153, 0.15), 0 0 50px rgba(236, 72, 153, 0.05);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .auth-card::-webkit-scrollbar {
            width: 4px;
        }
        .auth-card::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.3);
            border-radius: 10px;
        }
        
        @keyframes fadeUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* ═══ الشعار ═══ */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.3), rgba(244, 114, 182, 0.2));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 1px solid rgba(236, 72, 153, 0.3);
            animation: logoGlow 3s ease-in-out infinite;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logo-icon:hover {
            transform: scale(1.05) rotate(5deg);
        }
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 60px rgba(236, 72, 153, 0.7); }
        }
        .logo-title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ec4899, #f472b6, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .logo-subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* ═══ رسالة ترحيب ═══ */
        .welcome-msg {
            text-align: center;
            margin-bottom: 24px;
            padding: 14px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(244, 114, 182, 0.05));
            border: 1px solid rgba(236, 72, 153, 0.25);
            border-radius: 16px;
            font-size: 13px;
            color: #f472b6;
            animation: softGlow 2s ease-in-out infinite;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        .welcome-msg::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.15), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        @keyframes softGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.2); }
            50% { box-shadow: 0 0 40px rgba(236, 72, 153, 0.4); }
        }
        
        /* ═══ أزرار التواصل ═══ */
        .social-section {
            margin-bottom: 24px;
        }
        .social-label {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }
        .social-buttons {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }
        .social-btn.google:hover {
            background: rgba(234, 67, 53, 0.15);
            border-color: rgba(234, 67, 53, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(234, 67, 53, 0.2);
        }
        .social-btn.facebook:hover {
            background: rgba(24, 119, 242, 0.15);
            border-color: rgba(24, 119, 242, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(24, 119, 242, 0.2);
        }
        .social-btn i {
            font-size: 20px;
        }
        .social-btn.google i { color: #EA4335; }
        .social-btn.facebook i { color: #1877F2; }
        .social-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* ═══ الفاصل ═══ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(236, 72, 153, 0.2);
        }
        
        /* ═══ التبويبات ═══ */
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(236, 72, 153, 0.06);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 24px;
            position: relative;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 40px;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 600;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab.active {
            background: linear-gradient(135deg, #ec4899, #f472b6);
            color: #fff;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }
        .tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* ═══ النماذج ═══ */
        .form {
            display: none;
            animation: formFade 0.4s ease;
        }
        .form.active {
            display: block;
        }
        @keyframes formFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            transition: color 0.3s;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 18px;
            border-radius: 16px;
            background: rgba(236, 72, 153, 0.04);
            border: 1px solid rgba(236, 72, 153, 0.15);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.4s;
            direction: rtl;
            font-family: 'Segoe UI', sans-serif;
        }
        .input-group input:focus {
            border-color: rgba(236, 72, 153, 0.6);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.1);
            background: rgba(236, 72, 153, 0.06);
        }
        .input-group input:focus ~ .input-icon {
            color: #ec4899;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* ═══ زر إظهار كلمة المرور ═══ */
        .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 4px;
        }
        .toggle-password:hover {
            color: #ec4899;
        }
        
        /* ═══ زر الإرسال ═══ */
        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(236, 72, 153, 0.6);
        }
        .btn-submit:hover::before {
            left: 100%;
        }
        .btn-submit:active {
            transform: scale(0.97);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* ═══ رسائل ═══ */
        .msg {
            text-align: center;
            color: #fca5a5;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .msg.success {
            color: #4ade80;
        }
        
        /* ═══ رابط نسيت كلمة المرور ═══ */
        .forgot-link {
            text-align: center;
            margin-top: 16px;
        }
        .forgot-link a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link a:hover {
            color: #ec4899;
        }
        
        /* ═══ Spinner ═══ */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ═══ Toast ═══ */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(236, 72, 153, 0.4);
            padding: 14px 24px;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(236, 72, 153, 0.2);
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
    </style>
</head>
<body>

<!-- ═══ الخلفية المتحركة ═══ -->
<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="particles" id="particles"></div>

<!-- ═══ البطاقة الرئيسية ═══ -->
<div class="auth-card">
    <!-- الشعار -->
    <div class="logo-section">
        <div class="logo-icon">💗</div>
        <div class="logo-title">لحظة</div>
        <div class="logo-subtitle">Lahza ✨</div>
    </div>
    
    <!-- رسالة ترحيب -->
    <div class="welcome-msg">
        💗 شارك لحظاتك الجميلة مع العالم
    </div>
    
    <!-- أزرار التواصل الاجتماعي -->
    <div class="social-section">
        <div class="social-label">المتابعة السريعة</div>
        <div class="social-buttons">
            <button class="social-btn google" onclick="signInWithGoogle()" id="btnGoogle">
                <i class="fab fa-google"></i>
                <span>Google</span>
            </button>
            <button class="social-btn facebook" onclick="signInWithFacebook()" id="btnFacebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </button>
        </div>
    </div>
    
    <!-- الفاصل -->
    <div class="divider">
        <span>أو بالبريد الإلكتروني</span>
    </div>
    
    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">
            <i class="fas fa-sign-in-alt"></i> دخول
        </button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">
            <i class="fas fa-user-plus"></i> اشتراك
        </button>
    </div>
    
    <!-- نموذج تسجيل الدخول -->
    <div id="formLogin" class="form active">
        <div class="input-group">
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="email">
            <i class="fas fa-envelope input-icon"></i>
        </div>
        
        <div class="input-group">
            <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
            <i class="fas fa-lock input-icon"></i>
            <button class="toggle-password" onclick="togglePasswordVisibility('loginPass', this)" type="button">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        
        <button id="btnLogin" onclick="doLogin()" class="btn-submit">
            <i class="fas fa-arrow-right-to-bracket"></i> تسجيل الدخول
        </button>
        
        <div class="msg" id="loginMsg"></div>
        
        <div class="forgot-link">
            <a href="#" onclick="event.preventDefault(); showToast('🔜 سيتم إضافة هذه الميزة قريباً')">
                نسيت كلمة المرور؟
            </a>
        </div>
    </div>
    
    <!-- نموذج الاشتراك -->
    <div id="formRegister" class="form">
        <div class="input-group">
            <input type="text" id="regName" placeholder="اسم المستخدم" autocomplete="username">
            <i class="fas fa-user input-icon"></i>
        </div>
        
        <div class="input-group">
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني" autocomplete="email">
            <i class="fas fa-envelope input-icon"></i>
        </div>
        
        <div class="input-group">
            <input type="password" id="regPass" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password">
            <i class="fas fa-lock input-icon"></i>
            <button class="toggle-password" onclick="togglePasswordVisibility('regPass', this)" type="button">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        
        <button id="btnRegister" onclick="doRegister()" class="btn-submit">
            <i class="fas fa-heart"></i> إنشاء حساب
        </button>
        
        <div class="msg" id="regMsg"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast-msg" id="toastMsg">✅ تم</div>

<script src="firebase-config.js"></script>
<script>
    // ═══ إنشاء الجسيمات ═══
    function createParticles() {
        const container = document.getElementById('particles');
        for(let i = 0; i < 25; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.animationDuration = (Math.random() * 8 + 8) + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            container.appendChild(particle);
        }
    }
    createParticles();
    
    // ═══ تبديل التبويبات ═══
    function switchTab(type) {
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('formLogin').classList.remove('active');
        document.getElementById('formRegister').classList.remove('active');
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('regMsg').innerText = '';
        
        if(type === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('formLogin').classList.add('active');
        } else {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('formRegister').classList.add('active');
        }
    }
    
    // ═══ إظهار/إخفاء كلمة المرور ═══
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if(input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<i class="fas fa-eye"></i>';
        }
    }
    
    // ═══ تسجيل الدخول عبر Google ═══
    async function signInWithGoogle() {
        const btn = document.getElementById('btnGoogle');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>';
        
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('email');
            provider.addScope('profile');
            
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            
            // حفظ بيانات المستخدم إذا لم تكن موجودة
            const userSnap = await db.ref('users/' + user.uid).once('value');
            if(!userSnap.exists()) {
                await createUserProfile(user, {
                    username: user.displayName || 'مستخدم',
                    email: user.email,
                    avatarUrl: user.photoURL || (DICEBEAR_URL + '?seed=' + user.uid),
                    hasCustomAvatar: !!user.photoURL
                });
            }
            
            window.location.replace('index.html');
        } catch(error) {
            console.error('Google sign-in error:', error);
            btn.disabled = false;
            btn.innerHTML = '<i class="fab fa-google"></i><span>Google</span>';
            
            if(error.code === 'auth/popup-closed-by-user') {
                showToast('❌ تم إغلاق نافذة تسجيل الدخول');
            } else if(error.code === 'auth/popup-blocked') {
                showToast('❌ الرجاء السماح بالنوافذ المنبثقة');
            } else {
                showToast('❌ خطأ في تسجيل الدخول');
            }
        }
    }
    
    // ═══ تسجيل الدخول عبر Facebook ═══
    async function signInWithFacebook() {
        const btn = document.getElementById('btnFacebook');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>';
        
        try {
            const provider = new firebase.auth.FacebookAuthProvider();
            provider.addScope('email');
            provider.addScope('public_profile');
            
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            
            // حفظ بيانات المستخدم إذا لم تكن موجودة
            const userSnap = await db.ref('users/' + user.uid).once('value');
            if(!userSnap.exists()) {
                await createUserProfile(user, {
                    username: user.displayName || 'مستخدم',
                    email: user.email,
                    avatarUrl: user.photoURL || (DICEBEAR_URL + '?seed=' + user.uid),
                    hasCustomAvatar: !!user.photoURL
                });
            }
            
            window.location.replace('index.html');
        } catch(error) {
            console.error('Facebook sign-in error:', error);
            btn.disabled = false;
            btn.innerHTML = '<i class="fab fa-facebook-f"></i><span>Facebook</span>';
            
            if(error.code === 'auth/popup-closed-by-user') {
                showToast('❌ تم إغلاق نافذة تسجيل الدخول');
            } else if(error.code === 'auth/account-exists-with-different-credential') {
                showToast('❌ يوجد حساب بنفس البريد الإلكتروني');
            } else if(error.code === 'auth/popup-blocked') {
                showToast('❌ الرجاء السماح بالنوافذ المنبثقة');
            } else {
                showToast('❌ خطأ في تسجيل الدخول');
            }
        }
    }
    
    // ═══ إنشاء ملف تعريف المستخدم ═══
    async function createUserProfile(user, additionalData = {}) {
        const coverColor = COVER_COLORS[Math.floor(Math.random() * COVER_COLORS.length)];
        const userData = {
            username: additionalData.username || 'مستخدم',
            email: user.email || '',
            bio: '',
            website: '',
            location: '',
            contactEmail: user.email || '',
            avatarUrl: additionalData.avatarUrl || (DICEBEAR_URL + '?seed=' + user.uid),
            hasCustomAvatar: additionalData.hasCustomAvatar || false,
            coverImageUrl: '',
            hasCustomCover: false,
            coverColor: coverColor,
            followers: {},
            following: {},
            totalLikes: 0,
            isVerified: false,
            verifiedAt: null,
            verifiedBy: null,
            banned: false,
            createdAt: Date.now(),
            lastSeen: Date.now(),
            wallet: {
                balance: 5000,
                totalEarned: 5000,
                totalWithdrawn: 0,
                pendingWithdrawal: 0,
                totalViews: 0,
                lastWithdrawal: null
            }
        };
        
        await db.ref('users/' + user.uid).set(userData);
    }
    
    // ═══ تسجيل الدخول التقليدي ═══
    async function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPass').value;
        const msg = document.getElementById('loginMsg');
        const btn = document.getElementById('btnLogin');
        
        if(!email || !password) {
            msg.innerText = '❌ الرجاء ملء جميع الحقول';
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> جاري الدخول...';
        msg.innerText = '';
        
        try {
            await auth.signInWithEmailAndPassword(email, password);
            window.location.replace('index.html');
        } catch(error) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> تسجيل الدخول';
            
            switch(error.code) {
                case 'auth/user-not-found':
                    msg.innerText = '❌ لا يوجد حساب بهذا البريد';
                    break;
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    msg.innerText = '❌ كلمة المرور غير صحيحة';
                    break;
                case 'auth/invalid-email':
                    msg.innerText = '❌ بريد إلكتروني غير صالح';
                    break;
                case 'auth/too-many-requests':
                    msg.innerText = '❌ محاولات كثيرة، حاول لاحقاً';
                    break;
                default:
                    msg.innerText = '❌ خطأ: ' + error.message;
            }
        }
    }
    
    // ═══ التسجيل التقليدي ═══
    async function doRegister() {
        const username = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPass').value;
        const msg = document.getElementById('regMsg');
        const btn = document.getElementById('btnRegister');
        
        if(!username || !email || !password) {
            msg.innerText = '❌ الرجاء ملء جميع الحقول';
            return;
        }
        if(username.length < 3) {
            msg.innerText = '❌ اسم المستخدم 3 أحرف على الأقل';
            return;
        }
        if(password.length < 6) {
            msg.innerText = '❌ كلمة المرور 6 أحرف على الأقل';
            return;
        }
        if(!email.includes('@') || !email.includes('.')) {
            msg.innerText = '❌ بريد إلكتروني غير صالح';
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> جاري الإنشاء...';
        msg.innerText = '';
        
        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
            
            await createUserProfile(user, {
                username: username,
                email: email
            });
            
            msg.innerText = '✅ تم إنشاء الحساب بنجاح! 🎉';
            msg.className = 'msg success';
            
            setTimeout(() => {
                window.location.replace('index.html');
            }, 1500);
            
        } catch(error) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-heart"></i> إنشاء حساب';
            msg.className = 'msg';
            
            switch(error.code) {
                case 'auth/email-already-in-use':
                    msg.innerText = '❌ البريد الإلكتروني مستخدم بالفعل';
                    break;
                case 'auth/weak-password':
                    msg.innerText = '❌ كلمة المرور ضعيفة جداً';
                    break;
                case 'auth/invalid-email':
                    msg.innerText = '❌ بريد إلكتروني غير صالح';
                    break;
                case 'auth/operation-not-allowed':
                    msg.innerText = '❌ التسجيل غير مفعل، راجع إعدادات Firebase';
                    break;
                default:
                    msg.innerText = '❌ خطأ: ' + (error.message || 'غير معروف');
            }
        }
    }
    
    // ═══ الإدخال بزر Enter ═══
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                if(document.getElementById('formLogin').classList.contains('active')) {
                    doLogin();
                } else {
                    doRegister();
                }
            }
        });
    });
    
    // ═══ التحقق من حالة المستخدم ═══
    auth.onAuthStateChanged(user => {
        if(user) {
            window.location.replace('index.html');
        }
    });
    
    // ═══ Toast ═══
    function showToast(message) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
    
    console.log('💗 لحظة | Auth Ready with Google & Facebook ✨');
</script>
