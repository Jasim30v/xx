<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💗 MNAENCA | دردشة</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        
    :root{
        --glass:rgba(236,72,153,0.03);
        --border:rgba(236,72,153,0.12);
        --accent:#ec4899;
        --accent2:#f472b6;
        --bg:#020617;
        --card:rgba(236,72,153,0.06);
        --danger:#ef4444;
        --success:#22c55e;
        --warning:#f59e0b;
        --gold:#fbbf24;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background:var(--bg);
        color:#fff;
        -webkit-tap-highlight-color:transparent;
        user-select:none;
        -webkit-user-select:none;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
    @keyframes scaleIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes pinkGlow{0%,100%{box-shadow:0 0 20px rgba(236,72,153,0.3)}50%{box-shadow:0 0 40px rgba(244,114,182,0.7)}}
    @keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.3)}50%{box-shadow:0 0 40px rgba(251,191,36,0.7)}}
    .spinner{
        width:36px;height:36px;
        border:3px solid rgba(236,72,153,0.2);
        border-top-color:var(--accent);
        border-radius:50%;
        animation:spin 0.7s linear infinite;
        margin:30px auto;
    }
    .toast-msg{
        position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
        background:rgba(2,6,23,0.95);padding:12px 24px;border-radius:30px;
        z-index:10000;border:1px solid rgba(236,72,153,0.3);font-size:13px;
        opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;
        box-shadow:0 8px 32px rgba(0,0,0,0.4);
    }
    .toast-msg.show{opacity:1}
    .overlay{
        position:fixed;inset:0;background:rgba(2,6,23,0.97);
        backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
        z-index:400;overflow-y:auto;
        animation:fadeIn 0.3s ease;
    }
    .overlay-header{
        display:flex;justify-content:space-between;align-items:center;
        padding:16px 20px;border-bottom:1px solid var(--border);
        position:sticky;top:0;background:rgba(2,6,23,0.9);
        backdrop-filter:blur(20px);z-index:5;
    }
    .overlay-header h3{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
    .btn-close-overlay{
        background:rgba(236,72,153,0.1);border:1px solid var(--border);
        color:#fff;width:36px;height:36px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;font-size:16px;transition:all 0.3s;
    }
    .btn-close-overlay:hover{background:rgba(236,72,153,0.25);box-shadow:0 0 15px rgba(236,72,153,0.3)}

        body{height:100vh;display:flex;flex-direction:column}
        .header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);background:rgba(2,6,23,0.8);backdrop-filter:blur(20px)}
        .btn-back{background:rgba(236,72,153,0.1);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:16px;text-decoration:none}
        .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
        .bubble{max-width:80%;padding:10px 16px;border-radius:20px;word-break:break-word;font-size:14px;position:relative;animation:msgIn 0.3s ease}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .bubble.sent{background:linear-gradient(135deg,var(--accent),var(--accent2));align-self:flex-end;color:#fff}
        .bubble.received{background:rgba(236,72,153,0.06);align-self:flex-start;border:1px solid rgba(236,72,153,0.1)}
        .bubble img{max-width:200px;border-radius:12px;cursor:pointer;margin-top:4px;display:block}
        .bubble audio{max-width:200px;margin-top:4px}
        .bubble .time{font-size:9px;opacity:0.6;margin-top:4px}
        .input-bar{display:flex;gap:10px;padding:12px;background:rgba(2,6,23,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);align-items:center}
        .input-bar input{flex:1;padding:12px 16px;border-radius:30px;background:var(--glass);border:1px solid var(--border);color:#fff;font-size:14px;outline:none}
        .btn-icon{width:42px;height:42px;background:rgba(236,72,153,0.1);border:1px solid var(--border);border-radius:50%;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;border:none}
        .btn-icon:hover{background:rgba(236,72,153,0.25)}
        .btn-icon.recording{background:rgba(239,68,68,0.3);border:1px solid #ef4444;animation:pulse 1.5s infinite}
        .btn-send{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
        .conv-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer}
        .conv-item:hover{background:rgba(236,72,153,0.04)}
        .chat-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid rgba(236,72,153,0.3);flex-shrink:0}
        .chat-avatar img{width:100%;height:100%;object-fit:cover}
        .online-indicator{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;margin-left:6px}
        .upload-progress{
            position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
            background:rgba(2,6,23,0.95);padding:16px 24px;border-radius:20px;
            border:1px solid var(--accent);z-index:1000;text-align:center;
            display:none;
        }
        .recording-indicator{
            position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
            background:rgba(2,6,23,0.95);padding:16px 24px;border-radius:20px;
            border:1px solid #ef4444;z-index:1000;text-align:center;
            display:none;color:#ef4444;font-weight:700;
        }
        .recording-indicator .rec-dot{
            width:12px;height:12px;background:#ef4444;border-radius:50%;
            display:inline-block;animation:pulse 1s infinite;
        }
    </style>
</head>
<body>
<div id="loader" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div class="spinner"></div><span>💗 تحميل...</span></div>

<div id="convView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-right"></i></a>
        <h2><i class="fas fa-comments"></i> المحادثات</h2>
    </div>
    <div id="convList" style="flex:1;overflow-y:auto"></div>
</div>

<div id="chatView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
        <button class="btn-back" onclick="showConvs()"><i class="fas fa-arrow-right"></i></button>
        <div class="chat-avatar" id="chatAvatar"></div>
        <h3 id="chatName">محادثة</h3>
        <span id="chatOnline" style="font-size:11px;opacity:0.5;margin-right:8px"></span>
    </div>
    <div class="msgs" id="msgsList"></div>
    <div class="input-bar">
        <button class="btn-icon" onclick="triggerImageUpload()" title="إرسال صورة"><i class="fas fa-image"></i></button>
        <button class="btn-icon" id="btnRecord" onclick="toggleRecording()" title="تسجيل صوتي"><i class="fas fa-microphone"></i></button>
        <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        <button class="btn-icon" onclick="copyChat()" title="نسخ المحادثة"><i class="fas fa-copy"></i></button>
    </div>
</div>

<div class="upload-progress" id="uploadProgress">
    <div class="spinner" style="margin:0 auto 10px"></div>
    <span id="uploadProgressText">⏳ جاري الرفع...</span>
</div>

<div class="recording-indicator" id="recordingIndicator">
    <span class="rec-dot"></span> جاري التسجيل... <span id="recordingTime">0:00</span>
</div>

<input type="file" id="imageInput" accept="image/*" style="display:none">

<div class="toast-msg" id="toastMsg">✅ تم</div>

<script src="firebase-config.js"></script>
<script>
    let currentUser = null;
    let allUsers = {};
    let chatUserId = null;
    let messagesListener = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartTime = null;
    let recordingTimer = null;
    let isRecording = false;

    auth.onAuthStateChanged(async (u) => {
        if(!u) {
            window.location.href = 'auth.html';
            return;
        }
        currentUser = u;
        
        try {
            const usersSnapshot = await db.ref('users').once('value');
            allUsers = usersSnapshot.val() || {};
        } catch(e) {
            console.error('Error loading users:', e);
        }
        
        document.getElementById('loader').style.display = 'none';
        
        const params = new URLSearchParams(window.location.search);
        const targetUid = params.get('uid');
        if(targetUid) {
            openChat(targetUid);
        } else {
            showConvs();
        }
        
        setInterval(() => {
            if(currentUser) {
                db.ref('users/' + currentUser.uid + '/lastSeen').set(Date.now());
            }
        }, 60000);
    });

    function showConvs() {
        if(messagesListener) {
            db.ref('private_messages/' + getChatId()).off('value', messagesListener);
            messagesListener = null;
        }
        document.getElementById('chatView').style.display = 'none';
        document.getElementById('convView').style.display = 'flex';
        chatUserId = null;
        loadConvs();
    }

    async function loadConvs() {
        const convList = document.getElementById('convList');
        convList.innerHTML = '';
        
        try {
            const snapshot = await db.ref('private_messages').once('value');
            const allMessages = snapshot.val() || {};
            const foundUsers = new Set();
            
            Object.keys(allMessages).forEach(chatId => {
                const parts = chatId.split('_');
                const user1 = parts[0];
                const user2 = parts[1];
                const otherUser = user1 === currentUser.uid ? user2 : (user2 === currentUser.uid ? user1 : null);
                if(otherUser && !foundUsers.has(otherUser) && allUsers[otherUser]) {
                    foundUsers.add(otherUser);
                }
            });
            
            if(!foundUsers.size) {
                convList.innerHTML = '<div style="text-align:center;opacity:0.5;padding:40px"><i class="fas fa-comments" style="font-size:48px;color:#ec4899;margin-bottom:12px;display:block"></i><p>لا محادثات بعد</p></div>';
                return;
            }
            
            foundUsers.forEach(uid => {
                const user = allUsers[uid];
                const div = document.createElement('div');
                div.className = 'conv-item';
                div.innerHTML = `<div class="chat-avatar"><img src="${user?.avatarUrl || (DICEBEAR_URL + '?seed=' + uid)}"></div><div style="flex:1"><div style="font-weight:600">@${user?.username || '?'} ${user?.isVerified ? '<span style="color:#f472b6;font-size:12px"><i class="fas fa-check-circle"></i></span>' : ''}</div></div><i class="fas fa-chevron-left" style="opacity:0.4;font-size:12px"></i>`;
                div.onclick = () => openChat(uid);
                convList.appendChild(div);
            });
        } catch(e) {
            console.error('Error loading conversations:', e);
        }
    }

    async function openChat(uid) {
        chatUserId = uid;
        const user = allUsers[uid];
        
        document.getElementById('chatName').innerText = '@' + (user?.username || 'مستخدم');
        document.getElementById('chatAvatar').innerHTML = `<img src="${user?.avatarUrl || (DICEBEAR_URL + '?seed=' + uid)}">`;
        document.getElementById('convView').style.display = 'none';
        document.getElementById('chatView').style.display = 'flex';
        
        db.ref('presence/' + uid).on('value', (snapshot) => {
            const isOnline = snapshot.val();
            document.getElementById('chatOnline').innerHTML = isOnline ? 
                '<span class="online-indicator"></span> نشط الآن' : 
                'آخر ظهور: ' + formatTime(user?.lastSeen);
        });
        
        await loadMessages();
        
        if(messagesListener) {
            db.ref('private_messages/' + getChatId()).off('value', messagesListener);
        }
        messagesListener = db.ref('private_messages/' + getChatId()).on('value', async () => {
            await loadMessages();
        });
    }

    function getChatId() {
        return [currentUser.uid, chatUserId].sort().join('_');
    }

    async function loadMessages() {
        const messagesList = document.getElementById('msgsList');
        if(!chatUserId) return;
        
        try {
            const snapshot = await db.ref('private_messages/' + getChatId()).once('value');
            const messages = snapshot.val() || {};
            messagesList.innerHTML = '';
            
            const messagesArray = Object.values(messages).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            
            if(!messagesArray.length) {
                messagesList.innerHTML = '<div style="text-align:center;opacity:0.4;padding:40px"><i class="fas fa-comment-dots" style="font-size:40px;color:#ec4899;margin-bottom:10px;display:block"></i><p>ابدأ المحادثة!</p></div>';
                return;
            }
            
            messagesArray.forEach(message => {
                const isSent = message.senderId === currentUser.uid;
                const div = document.createElement('div');
                div.className = 'bubble ' + (isSent ? 'sent' : 'received');
                
                if(message.type === 'image' && message.imageUrl) {
                    div.innerHTML = `<img src="${message.imageUrl}" onclick="window.open('${message.imageUrl}','_blank')" alt="صورة" onerror="this.style.display='none'"><div class="time">${new Date(message.timestamp).toLocaleTimeString('ar-SA')}</div>`;
                } else if(message.type === 'audio' && message.audioUrl) {
                    div.innerHTML = `<audio controls src="${message.audioUrl}" style="max-width:200px"></audio><div class="time">${new Date(message.timestamp).toLocaleTimeString('ar-SA')}</div>`;
                } else {
                    div.innerHTML = `${message.text || ''}<div class="time">${new Date(message.timestamp).toLocaleTimeString('ar-SA')}</div>`;
                }
                
                messagesList.appendChild(div);
            });
            
            messagesList.scrollTop = messagesList.scrollHeight;
        } catch(e) {
            console.error('Error loading messages:', e);
        }
    }

    async function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text || !chatUserId) return;
        
        try {
            await db.ref('private_messages/' + getChatId()).push({
                senderId: currentUser.uid,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });
            input.value = '';
            await loadMessages();
        } catch(e) {
            console.error('Error sending message:', e);
            showToast('❌ فشل إرسال الرسالة');
        }
    }

    function triggerImageUpload() {
        if(!chatUserId) {
            showToast('❌ اختر محادثة أولاً');
            return;
        }
        document.getElementById('imageInput').click();
    }

    document.getElementById('imageInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if(!file) return;
        
        // التحقق من نوع الملف
        if(!file.type.startsWith('image/')) {
            showToast('❌ الرجاء اختيار صورة');
            return;
        }
        
        // التحقق من الحجم (5MB)
        if(file.size > 5 * 1024 * 1024) {
            showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 5MB)');
            return;
        }
        
        const uploadProgress = document.getElementById('uploadProgress');
        const uploadProgressText = document.getElementById('uploadProgressText');
        uploadProgress.style.display = 'block';
        uploadProgressText.innerText = '⏳ جاري رفع الصورة...';
        
        try {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            console.log('Uploading image to Cloudinary...');
            
            const response = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            console.log('Cloudinary response:', data);
            
            if(data.secure_url) {
                await db.ref('private_messages/' + getChatId()).push({
                    senderId: currentUser.uid,
                    type: 'image',
                    imageUrl: data.secure_url,
                    timestamp: Date.now()
                });
                await loadMessages();
                showToast('✅ تم إرسال الصورة');
            } else {
                console.error('Cloudinary error:', data);
                showToast('❌ فشل رفع الصورة: ' + (data.error?.message || 'خطأ غير معروف'));
            }
        } catch(error) {
            console.error('Image upload error:', error);
            showToast('❌ خطأ في رفع الصورة: ' + error.message);
        } finally {
            uploadProgress.style.display = 'none';
            e.target.value = '';
        }
    });

    async function toggleRecording() {
        if(!chatUserId) {
            showToast('❌ اختر محادثة أولاً');
            return;
        }
        
        const recordBtn = document.getElementById('btnRecord');
        
        if(isRecording) {
            // إيقاف التسجيل
            if(mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            isRecording = false;
            recordBtn.classList.remove('recording');
            document.getElementById('recordingIndicator').style.display = 'none';
            clearInterval(recordingTimer);
        } else {
            // بدء التسجيل
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if(event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    
                    if(audioBlob.size > 0) {
                        const uploadProgress = document.getElementById('uploadProgress');
                        const uploadProgressText = document.getElementById('uploadProgressText');
                        uploadProgress.style.display = 'block';
                        uploadProgressText.innerText = '⏳ جاري رفع الصوت...';
                        
                        try {
                            const formData = new FormData();
                            formData.append('file', audioBlob, 'voice-message.webm');
                            formData.append('upload_preset', UPLOAD_PRESET);
                            
                            console.log('Uploading audio to Cloudinary...');
                            
                            const response = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/auto/upload', {
                                method: 'POST',
                                body: formData
                            });
                            
                            const data = await response.json();
                            console.log('Cloudinary audio response:', data);
                            
                            if(data.secure_url) {
                                await db.ref('private_messages/' + getChatId()).push({
                                    senderId: currentUser.uid,
                                    type: 'audio',
                                    audioUrl: data.secure_url,
                                    timestamp: Date.now()
                                });
                                await loadMessages();
                                showToast('✅ تم إرسال الرسالة الصوتية');
                            } else {
                                console.error('Cloudinary audio error:', data);
                                showToast('❌ فشل رفع الصوت: ' + (data.error?.message || 'خطأ غير معروف'));
                            }
                        } catch(error) {
                            console.error('Audio upload error:', error);
                            showToast('❌ خطأ في رفع الصوت: ' + error.message);
                        } finally {
                            uploadProgress.style.display = 'none';
                        }
                    }
                    
                    mediaRecorder = null;
                    audioChunks = [];
                };
                
                mediaRecorder.start();
                recordingStartTime = Date.now();
                recordingTimer = setInterval(updateRecordingTime, 1000);
                
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerHTML = '<i class="fas fa-stop"></i>';
                document.getElementById('recordingIndicator').style.display = 'block';
                updateRecordingTime();
                
            } catch(error) {
                console.error('Recording error:', error);
                showToast('❌ لا يمكن الوصول للميكروفون: ' + error.message);
            }
        }
    }

    function updateRecordingTime() {
        if(!recordingStartTime) return;
        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById('recordingTime').innerText = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
    }

    async function copyChat() {
        if(!chatUserId) return;
        
        const snapshot = await db.ref('private_messages/' + getChatId()).once('value');
        const messages = snapshot.val() || {};
        let text = '💬 محادثة MNAENCA
' + '─'.repeat(30) + '
';
        
        Object.values(messages).sort((a, b) => a.timestamp - b.timestamp).forEach(message => {
            const sender = message.senderId === currentUser.uid ? 'أنت' : (allUsers[message.senderId]?.username || 'مستخدم');
            const content = message.type === 'image' ? '[صورة 📷]' : (message.type === 'audio' ? '[رسالة صوتية 🎤]' : message.text);
            const time = new Date(message.timestamp).toLocaleTimeString('ar-SA');
            text += `
${sender} (${time}):
${content}
`;
        });
        
        try {
            await navigator.clipboard.writeText(text);
        } catch(e) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }
        
        showToast('✅ تم نسخ المحادثة');
    }

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function formatTime(timestamp) {
        if(!timestamp) return 'غير معروف';
        const diff = Date.now() - timestamp;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        
        if(minutes < 1) return 'الآن';
        if(minutes < 60) return 'منذ ' + minutes + ' دقيقة';
        if(hours < 24) return 'منذ ' + hours + ' ساعة';
        if(days < 7) return 'منذ ' + days + ' يوم';
        return new Date(timestamp).toLocaleDateString('ar-SA');
    }

    console.log('💗 MNAENCA Chat Ready with Full Media Support');
</script>
